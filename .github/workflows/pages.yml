# Publishes the offline copy of the game (site/, built by tests/site.js) on GitHub Pages at each push to main.
name: Publier le jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/site.js
      # The video game of Malvoran (jeu/, 27/11), served beside the book at /jeu/.
      # A failure here must not stop the book's own publication.
      - run: cd jeu && npm ci && npm test && npm run build && cp -r dist ../site/jeu
        continue-on-error: true
      # Optional quality voices (site/voix/, ~150 Mo), downloaded by readers only on request.
      - run: node tests/voix.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # The artifact sometimes shows up in the API a few seconds after its upload: deploy-pages then finds
      # « 0 artifact(s) » and the run fails though nothing is wrong. Wait a little, and try once more if needed.
      - run: sleep 15
      - id: essai
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.essai.outcome == 'failure'
        run: sleep 45
      - id: reprise
        if: steps.essai.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploiement
        run: echo "page_url=${{ steps.essai.outputs.page_url || steps.reprise.outputs.page_url }}" >> "$GITHUB_OUTPUT"
