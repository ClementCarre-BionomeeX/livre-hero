<title>Graphe des scénarios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a one-screen workbench. A toolbar and a legend that doubles as a filter on top, the graph on a pannable sheet below, the passage card on the side. */
:root {
  --bg: #f3f4f1; --sheet: #fbfbf9; --fg: #1d2420; --muted: #66706a; --line: #d3d8d2; --node: #ffffff; --accent: #1f6f5c;
  --k-libre: #5b655f; --k-cond: #b3661a; --k-avec: #2b62b8; --k-heure: #7a4bb0; --k-reussi: #2c8a4b; --k-rate: #c0392b; --k-combat: #8a2f2f; --k-route: #8a8f6a; --k-unefois: #0f8a8a;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --sheet: #171c19; --fg: #e6ebe7; --muted: #98a39c; --line: #2c3530; --node: #1f2622; --accent: #5cc3a8;
  --k-libre: #a3ada7; --k-cond: #e39a4a; --k-avec: #6fa2f0; --k-heure: #b18ce6; --k-reussi: #5fc07e; --k-rate: #ef7264; --k-combat: #d98080; --k-route: #b3b88a; --k-unefois: #4cc7c7; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --sheet: #171c19; --fg: #e6ebe7; --muted: #98a39c; --line: #2c3530; --node: #1f2622; --accent: #5cc3a8;
  --k-libre: #a3ada7; --k-cond: #e39a4a; --k-avec: #6fa2f0; --k-heure: #b18ce6; --k-reussi: #5fc07e; --k-rate: #ef7264; --k-combat: #d98080; --k-route: #b3b88a; --k-unefois: #4cc7c7; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.bar h1 { font: 600 17px/1.2 var(--display); margin: 0 6px 0 0; }
select, input[type="search"], button { font: 500 13px/1.2 var(--body); color: var(--fg); background: var(--node); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
input[type="search"] { width: 190px; max-width: 100%; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.legend label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px 3px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--node); cursor: pointer; user-select: none; }
.legend input { margin: 0; accent-color: var(--accent); }
.legend svg { flex: none; }
.legend .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { position: relative; flex: 1; min-height: 0; background: var(--sheet); overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.card { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--node); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); }
.card header { display: flex; gap: 8px; align-items: flex-start; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.card h2 { font: 600 16px/1.25 var(--display); margin: 0; text-wrap: balance; flex: 1; min-width: 0; }
.card .body { overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.id { font: 12px/1.3 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.sec { font: 600 11px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.excerpt { color: var(--muted); font-size: 13px; }
.edge { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; text-align: left; width: 100%; }
.edge i { width: 10px; height: 10px; border-radius: 3px; margin-top: 4px; }
.edge b { font-weight: 500; overflow-wrap: anywhere; }
.edge small { grid-column: 2; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; font-size: 12px; color: var(--muted); background: var(--node); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: calc(100% - 24px); }
@media (max-width: 640px) { .card { top: auto; left: 12px; right: 12px; width: auto; height: 52%; } .bar h1 { width: 100%; } }
</style>

<div class="bar">
  <h1>Graphe des scénarios</h1>
  <select id="story" aria-label="Scénario"></select>
  <select id="act" aria-label="Acte"></select>
  <select id="place" aria-label="Lieu"></select>
  <input type="search" id="find" placeholder="Chercher un passage" aria-label="Chercher un passage" list="found">
  <datalist id="found"></datalist>
  <button id="fit" type="button">Tout voir</button>
  <label style="display:inline-flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="spoil"> Afficher les textes</label>
</div>
<div class="legend" id="legend"></div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hint" id="hint"></div>
  <aside class="card" id="card" hidden>
    <header><div style="flex:1;min-width:0"><h2 id="c-title"></h2><div class="id" id="c-id"></div></div><button id="c-close" type="button" aria-label="Fermer">Fermer</button></header>
    <div class="body" id="c-body"></div>
  </aside>
</div>

<script>
var DATA = /*DATA*/null;
var KINDS = [
  { k: "libre", name: "Choix libre", dash: [] },
  { k: "cond", name: "Selon un événement (if, after, before)", dash: [7, 4] },
  { k: "avec", name: "Selon un compagnon (with, without)", dash: [2, 3] },
  { k: "heure", name: "Selon l'heure ou le jour (when)", dash: [10, 3, 2, 3] },
  { k: "unefois", name: "Une seule fois (once)", dash: [1, 4] },
  { k: "reussi", name: "Jet réussi", dash: [] },
  { k: "rate", name: "Jet raté", dash: [] },
  { k: "combat", name: "Issue d'un combat", dash: [] },
  { k: "route", name: "Route entre deux lieux", dash: [12, 6] }

var KIND = {}; KINDS.forEach(function (x) { KIND[x.k] = x; });
var $ = function (id) { return document.getElementById(id); };
var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
var S = { story: null, act: null, nodes: [], edges: [], byId: {}, sel: null, on: {}, view: { x: 0, y: 0, z: 1 }, colors: {} };
KINDS.forEach(function (x) { S.on[x.k] = true; });
var NW = 172, NH = 46, GX = 16, GY = 92, ROW = 26;

function colors() {
  var cs = getComputedStyle(document.documentElement), o = {};
  ["bg", "sheet", "fg", "muted", "line", "node", "accent"].concat(KINDS.map(function (x) { return "k-" + x.k; })).forEach(function (n) { o[n] = cs.getPropertyValue("--" + n).trim(); });
  S.colors = o;
}

// Layers: distance from the act's start along the arrows; what the start never reaches (road events, camp talks) goes below.
function build() {
  var G = S.story, act = S.act, inSet = {}, nodes = [], byId = {};
  var around = null;
  if (S.around) { // only what lies within a few steps of one passage, both ways
    around = {}; around[S.around] = 0; var q = [S.around], nb = {};
    G.edges.forEach(function (e) { if (e.t.charAt(0) === "@") return; (nb[e.f] = nb[e.f] || []).push(e.t); (nb[e.t] = nb[e.t] || []).push(e.f); });
    while (q.length) { var cur = q.shift(); if (around[cur] >= 3) continue; (nb[cur] || []).forEach(function (o) { if (around[o] == null) { around[o] = around[cur] + 1; q.push(o); } }); }
  }
  G.nodes.forEach(function (n) { if (around ? around[n.id] != null : ((act === "*" || n.a === act) && (!S.place || n.p === S.place))) { var m = { id: n.id, n: n, out: [], inn: [], layer: -1 }; nodes.push(m); byId[n.id] = m; inSet[n.id] = 1; } });
  var all = {}; G.nodes.forEach(function (n) { all[n.id] = n; });
  var edges = [];
  G.edges.forEach(function (e) {
    if (e.t.charAt(0) === "@" || !all[e.t]) return;
    var a = byId[e.f], b = byId[e.t];
    if (!a && !b) return;
    if (around && (!a || !b)) return;
    if (!a || !b) { // a neighbour in another act or place: shown as a ghost node at the edge of this one
      var other = a ? e.t : e.f, gid = "↗" + other;
      if (!byId[gid]) { var g = { id: gid, n: all[other], ghost: true, out: [], inn: [], layer: -1 }; nodes.push(g); byId[gid] = g; }
      if (a) b = byId[gid]; else a = byId[gid];
    }
    var ed = { a: a, b: b, e: e }; edges.push(ed); a.out.push(ed); b.inn.push(ed);
  });
  var queue = [], maxL = 0;
  function bfs(starts, base) {
    starts.forEach(function (m) { if (m.layer < 0) { m.layer = base; queue.push(m); } });
    while (queue.length) { var m = queue.shift(); maxL = Math.max(maxL, m.layer); m.out.forEach(function (ed) { if (ed.b.layer < 0) { ed.b.layer = m.layer + 1; queue.push(ed.b); } }); }
  }
  if (around && byId[S.around]) bfs([byId[S.around]].concat(nodes.filter(function (m) { return !m.inn.length; })), 0);
  var roots = nodes.filter(function (m) { return !m.ghost && (m.n.id === G.start || G.acts.some(function (a) { return a.start === m.n.id && (act === "*" ? a.id === G.acts[0].id : a.id === act); })); });
  if (!roots.length) roots = nodes.filter(function (m) { return m.ghost && m.out.length; });
  bfs(roots, 0);
  if (act === "*") bfs(nodes.filter(function (m) { return m.layer < 0 && G.acts.some(function (a) { return a.start === m.n.id; }); }), maxL + 1);
  var rest = nodes.filter(function (m) { return m.layer < 0; });
  if (rest.length) {
    var base = maxL + 2;
    bfs(rest.filter(function (m) { return !m.inn.some(function (ed) { return ed.a.layer < 0; }); }), base);
    rest.forEach(function (m) { if (m.layer < 0) bfs([m], base); });
    S.restFrom = base;
  } else S.restFrom = null;
  var layers = [];
  nodes.forEach(function (m) { (layers[m.layer] = layers[m.layer] || []).push(m); });
  for (var i = 0; i < layers.length; i++) layers[i] = layers[i] || [];
  layers.forEach(function (L) { L.forEach(function (m, i) { m.pos = i; }); });
  for (var sweep = 0; sweep < 4; sweep++) layers.forEach(function (L) {
    L.forEach(function (m) { var ps = m.inn.filter(function (ed) { return ed.a.layer < m.layer; }).map(function (ed) { return ed.a.pos / Math.max(1, layers[ed.a.layer].length - 1); }); m.bc = ps.length ? ps.reduce(function (x, y) { return x + y; }, 0) / ps.length : m.pos / Math.max(1, L.length - 1); });
    L.sort(function (x, y) { return x.bc - y.bc; }); L.forEach(function (m, i) { m.pos = i; });
  });

  layers.forEach(function (L, li) {

    var rows = Math.max(1, Math.ceil(L.length / ROW)), per = Math.ceil(L.length / rows);
    L.forEach(function (m, i) { var r = Math.floor(i / per), c = i % per, n = Math.min(per, L.length - r * per); m.x = (c - (n - 1) / 2) * (NW + GX) + (r % 2 ? (NW + GX) / 2 : 0); m.y = y + r * (NH + 26); });
    y += (rows - 1) * (NH + 26) + NH + GY;
  });
  S.nodes = nodes; S.edges = edges; S.byId = byId; S.sel = null;
  var counts = {}; edges.forEach(function (ed) { counts[ed.e.k] = (counts[ed.e.k] || 0) + 1; });
  legend(counts); fit(); card(null);
  $("found").innerHTML = "";
  nodes.slice(0, 3000).forEach(function (m) { if (m.ghost) return; var o = document.createElement("option"); o.value = m.n.id; o.label = m.n.t; $("found").appendChild(o); });
  $("hint").textContent = nodes.filter(function (m) { return !m.ghost; }).length + " passages · " + edges.length + " flèches · glisser pour déplacer, molette ou pincement pour zoomer, clic sur un passage";
}

function legend(counts) {
  var box = $("legend"); box.innerHTML = "";
  KINDS.forEach(function (x) {
    var lab = document.createElement("label"), inp = document.createElement("input");
    inp.type = "checkbox"; inp.checked = S.on[x.k]; inp.id = "k-" + x.k;
    inp.addEventListener("change", function () { S.on[x.k] = inp.checked; draw(); });
    var svg = '<svg width="34" height="10" viewBox="0 0 34 10" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" stroke="var(--k-' + x.k + ')" stroke-width="' + (x.k === "combat" ? 3 : 2) + '" stroke-dasharray="' + x.dash.join(" ") + '" fill="none"/><path d="M27 1 L33 5 L27 9 Z" fill="var(--k-' + x.k + ')"/></svg>';
    lab.appendChild(inp); lab.insertAdjacentHTML("beforeend", svg);
    lab.appendChild(document.createTextNode(x.name + " "));
    var c = document.createElement("span"); c.className = "count"; c.textContent = counts[x.k] || 0; lab.appendChild(c);
    box.appendChild(lab);
  });
}

function size() { var r = stage.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); S.w = r.width; S.h = r.height; S.d = d; draw(); }
function fit() {
  if (!S.nodes.length) return;
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  S.nodes.forEach(function (m) { x0 = Math.min(x0, m.x - NW / 2); x1 = Math.max(x1, m.x + NW / 2); y0 = Math.min(y0, m.y); y1 = Math.max(y1, m.y + NH); });
  var z = Math.min((S.w - 40) / (x1 - x0), (S.h - 40) / (y1 - y0), 1.1); z = Math.max(z, 0.02);
  S.view = { z: z, x: S.w / 2 - (x0 + x1) / 2 * z, y: 20 - y0 * z + Math.max(0, (S.h - 40 - (y1 - y0) * z) / 2) }; draw();
}
function focus(m) { S.view.z = Math.max(S.view.z, 0.8); S.view.x = S.w / 2 - m.x * S.view.z - (S.w > 640 && !$("card").hidden ? 190 : 0); S.view.y = S.h * 0.35 - m.y * S.view.z; draw(); }

function path(ed) {
  var a = ed.a, b = ed.b, x1 = a.x, y1 = a.y + NH, x2 = b.x, y2 = b.y;
  if (b.y > a.y) { var my = (y1 + y2) / 2; return [x1, y1, x1, my, x2, my, x2, y2]; }
  // An arrow that goes back up (a return to a hub, a loop) swings out to the side.
  var side = (a.x <= b.x ? 1 : -1), off = 60 + Math.min(240, Math.abs(a.y - b.y) * 0.25);
  x1 = a.x + side * NW / 2; y1 = a.y + NH / 2; x2 = b.x + side * NW / 2; y2 = b.y + NH / 2;
  return [x1, y1, x1 + side * off, y1, x2 + side * off, y2, x2, y2];
}
function draw() {
  if (!S.w) return;
  var c = S.colors, v = S.view, d = S.d;
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.fillStyle = c.sheet; ctx.fillRect(0, 0, S.w, S.h);
  ctx.setTransform(d * v.z, 0, 0, d * v.z, d * v.x, d * v.y);
  var text = v.z > 0.42;
  var vx0 = -v.x / v.z, vy0 = -v.y / v.z, vx1 = (S.w - v.x) / v.z, vy1 = (S.h - v.y) / v.z, sel = S.sel;
  function vis(m) { return m.x + NW / 2 > vx0 && m.x - NW / 2 < vx1 && m.y + NH > vy0 && m.y < vy1; }
  S.edges.forEach(function (ed) {
    if (!S.on[ed.e.k]) return;
    var hot = sel && (ed.a === sel || ed.b === sel);
    if (!hot && !vis(ed.a) && !vis(ed.b) && !(Math.min(ed.a.y, ed.b.y) < vy1 && Math.max(ed.a.y, ed.b.y) > vy0 && Math.min(ed.a.x, ed.b.x) < vx1 && Math.max(ed.a.x, ed.b.x) > vx0)) return;
    var p = path(ed), col = c["k-" + ed.e.k];
    ctx.globalAlpha = sel ? (hot ? 1 : 0.12) : (ed.b.y > ed.a.y ? 0.75 : 0.35);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = (ed.e.k === "combat" ? 2.6 : 1.5) * (hot ? 1.6 : 1) / Math.max(v.z, 0.35) * Math.min(1, Math.max(v.z, 0.35));
    ctx.setLineDash(KIND[ed.e.k].dash); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]); ctx.stroke(); ctx.setLineDash([]);
    if (v.z > 0.25 || hot) { var ang = Math.atan2(p[7] - p[5], p[6] - p[4]), s = 7; ctx.beginPath(); ctx.moveTo(p[6], p[7]); ctx.lineTo(p[6] - s * Math.cos(ang - 0.4), p[7] - s * Math.sin(ang - 0.4)); ctx.lineTo(p[6] - s * Math.cos(ang + 0.4), p[7] - s * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
  S.nodes.forEach(function (m) {
    if (!vis(m)) return;
    var n = m.n, k = n.k, x = m.x - NW / 2, y = m.y, near = !sel || m === sel || m.out.some(function (ed) { return ed.b === sel; }) || m.inn.some(function (ed) { return ed.a === sel; });
    ctx.globalAlpha = near ? 1 : 0.3;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, NW, NH, k.indexOf("h") >= 0 ? 14 : 6); else ctx.rect(x, y, NW, NH);
    ctx.fillStyle = k.indexOf("e") >= 0 ? c.accent : text ? c.node : c.line; if (!m.ghost) ctx.fill();
    ctx.lineWidth = m === sel ? 3 : k.indexOf("h") >= 0 || k.indexOf("s") >= 0 ? 2.4 : 1.2;
    ctx.strokeStyle = m === sel ? c.accent : k.indexOf("c") >= 0 ? c["k-combat"] : k.indexOf("s") >= 0 ? c.accent : k.indexOf("h") >= 0 ? c.fg : c.line;
    ctx.setLineDash(m.ghost ? [4, 4] : k.indexOf("v") >= 0 ? [6, 3] : []); ctx.stroke(); ctx.setLineDash([]);
    if (n.g && !m.ghost) { ctx.fillStyle = c["k-cond"]; ctx.beginPath(); ctx.arc(x + NW - 9, y + 9, 3.5, 0, 7); ctx.fill(); }
    if (text) {
      ctx.fillStyle = k.indexOf("e") >= 0 && !m.ghost ? c.sheet : m.ghost ? c.muted : c.fg; ctx.font = "500 12px Inter, system-ui, sans-serif"; ctx.textBaseline = "middle";
      var t = (m.ghost ? "↗ " : "") + n.t; while (t.length > 4 && ctx.measureText(t).width > NW - 18) t = t.slice(0, -2); if (t !== (m.ghost ? "↗ " : "") + n.t) t = t.slice(0, -1) + "…";
      ctx.fillText(t, x + 9, y + 16);
      ctx.fillStyle = k.indexOf("e") >= 0 && !m.ghost ? c.sheet : c.muted; ctx.font = "11px Inter, system-ui, sans-serif";
      var sub = (m.ghost ? "acte " + n.a : n.p || n.id); while (sub.length > 4 && ctx.measureText(sub).width > NW - 18) sub = sub.slice(0, -2);
      ctx.fillText(sub, x + 9, y + 33);
    }
  });

}

function card(m) {
  S.sel = m; var box = $("card");
  if (!m) { box.hidden = true; draw(); return; }
  var n = m.n; box.hidden = false; $("c-title").textContent = n.t; $("c-id").textContent = n.id + (n.a ? " · acte " + n.a : "") + (n.p ? " · " + n.p : "");
  var body = $("c-body"); body.innerHTML = "";
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; body.appendChild(e); return e; }
  var chips = el("div", "chips"), names = { h: "carrefour", e: "fin", c: "combat", s: "début d'acte", q: "début de quête", v: "événement de route ou de veillée", r: "routes ouvertes" };
  Object.keys(names).forEach(function (k) { if (n.k.indexOf(k) >= 0) { var s = document.createElement("span"); s.className = "chip"; s.textContent = names[k]; chips.appendChild(s); } });
  var s2 = document.createElement("span"); s2.className = "chip"; s2.textContent = n.n + " paragraphe" + (n.n > 1 ? "s" : "") + (n.g ? " dont " + n.g + " sous condition ou tag" : ", aucun tag"); chips.appendChild(s2);
  if (n.sc) el("div", "excerpt", "Distribution de la scène : " + n.sc);
  if ($("spoil").checked && n.x) el("div", "excerpt", n.x + (n.x.length >= 220 ? "…" : ""));
  function list(title, eds, far) {
    if (!eds.length) return; el("div", "sec", title + " (" + eds.length + ")");
    eds.forEach(function (ed) {
      var o = ed[far], b = el("button", "edge"); b.type = "button";
      b.innerHTML = '<i style="background:var(--k-' + ed.e.k + ')"></i><b></b><small></small>';
      b.querySelector("b").textContent = (far === "b" ? "→ " : "← ") + o.n.t + (o.ghost ? " (acte " + o.n.a + ")" : "");
      b.querySelector("small").textContent = [KIND[ed.e.k].name.replace(/ \(.*/, ""), $("spoil").checked ? ed.e.l : "", ed.e.c].filter(Boolean).join(" · ");
      b.addEventListener("click", function () { if (o.ghost) { $("act").value = o.n.a; S.act = o.n.a; S.place = ""; S.around = null; places(); build(); var t = S.byId[o.n.id]; if (t) { card(t); focus(t); } } else { card(o); focus(o); } });
    });
  }
  var iso = el("button", null, S.around === n.id ? "Revenir à l'acte entier" : "Isoler ce passage et ses environs (3 pas)"); iso.type = "button";
  iso.addEventListener("click", function () { S.around = S.around === n.id ? null : n.id; if (!S.around) { S.act = n.a || S.act; $("act").value = S.act; } build(); var t = S.byId[n.id]; if (t) { card(t); focus(t); } });
  list("Sorties", m.out, "b"); list("Arrivées", m.inn, "a");
  draw();
}

function at(px, py) { var x = (px - S.view.x) / S.view.z, y = (py - S.view.y) / S.view.z; for (var i = S.nodes.length - 1; i >= 0; i--) { var m = S.nodes[i]; if (x >= m.x - NW / 2 && x <= m.x + NW / 2 && y >= m.y && y <= m.y + NH) return m; } return null; }
function zoom(f, px, py) { var v = S.view, z = Math.min(2.5, Math.max(0.02, v.z * f)); v.x = px - (px - v.x) * z / v.z; v.y = py - (py - v.y) * z / v.z; v.z = z; draw(); }
var ptrs = {}, moved = 0, pinch = 0;
cv.addEventListener("pointerdown", function (e) { cv.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.offsetX, y: e.offsetY }; moved = 0; pinch = 0; cv.classList.add("drag"); });
cv.addEventListener("pointermove", function (e) {
  var p = ptrs[e.pointerId]; if (!p) return; var ids = Object.keys(ptrs);
  if (ids.length === 2) { var o = ptrs[ids[0] == e.pointerId ? ids[1] : ids[0]], d = Math.hypot(e.offsetX - o.x, e.offsetY - o.y); if (pinch) zoom(d / pinch, (e.offsetX + o.x) / 2, (e.offsetY + o.y) / 2); pinch = d; moved = 9; }
  else { S.view.x += e.offsetX - p.x; S.view.y += e.offsetY - p.y; moved += Math.abs(e.offsetX - p.x) + Math.abs(e.offsetY - p.y); draw(); }
  p.x = e.offsetX; p.y = e.offsetY;
});
function up(e) { if (ptrs[e.pointerId] && moved < 5) { var m = at(e.offsetX, e.offsetY); card(m); } delete ptrs[e.pointerId]; pinch = 0; if (!Object.keys(ptrs).length) cv.classList.remove("drag"); }
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", function (e) { delete ptrs[e.pointerId]; pinch = 0; });
cv.addEventListener("wheel", function (e) { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0015), e.offsetX, e.offsetY); }, { passive: false });

function places() {
  var p = $("place"), seen = {}, list = []; p.innerHTML = "";
  S.story.nodes.forEach(function (n) { if ((S.act === "*" || n.a === S.act) && n.p && !seen[n.p]) { seen[n.p] = 0; list.push(n.p); } if (n.p && (S.act === "*" || n.a === S.act)) seen[n.p]++; });
  var o = document.createElement("option"); o.value = ""; o.textContent = "Tous les lieux"; p.appendChild(o);
  list.sort().forEach(function (x) { var o2 = document.createElement("option"); o2.value = x; o2.textContent = x + " · " + seen[x]; p.appendChild(o2); });
  p.value = S.place || ""; p.hidden = !list.length;
}
function pickStory(id) {
  S.story = DATA.filter(function (g) { return g.id === id; })[0] || DATA[0];
  var a = $("act"); a.innerHTML = "";
  S.story.acts.forEach(function (x) { var o = document.createElement("option"); o.value = x.id; o.textContent = "Acte " + x.id + (x.title && x.title !== x.id ? " · " + x.title : ""); a.appendChild(o); });
  var o = document.createElement("option"); o.value = "*"; o.textContent = "Tous les actes"; a.appendChild(o);
  S.act = S.story.nodes.length <= 400 ? "*" : S.story.acts[0].id; a.value = S.act; S.place = ""; S.around = null; places(); build();
}
DATA.forEach(function (g) { var o = document.createElement("option"); o.value = g.id; o.textContent = g.title + " · " + g.nodes.length + " passages"; $("story").appendChild(o); });
$("story").addEventListener("change", function () { pickStory($("story").value); });
$("act").addEventListener("change", function () { S.act = $("act").value; S.place = ""; S.around = null; places(); build(); });
$("place").addEventListener("change", function () { S.place = $("place").value; S.around = null; build(); });
$("fit").addEventListener("click", function () { card(null); fit(); });
$("c-close").addEventListener("click", function () { card(null); });
$("spoil").addEventListener("change", function () { if (S.sel) card(S.sel); });
$("find").addEventListener("change", function () {
  var q = $("find").value.trim().toLowerCase(); if (!q) return;
  var m = S.byId[$("find").value.trim()] || S.nodes.filter(function (x) { return !x.ghost && (x.n.id.toLowerCase().indexOf(q) >= 0 || x.n.t.toLowerCase().indexOf(q) >= 0); })[0];
  if (!m) { var hit = S.story.nodes.filter(function (n) { return n.id.toLowerCase().indexOf(q) >= 0 || n.t.toLowerCase().indexOf(q) >= 0; })[0]; if (hit && hit.a) { S.act = hit.a; $("act").value = hit.a; S.place = ""; S.around = null; places(); build(); m = S.byId[hit.id]; } }
  if (m) { card(m); focus(m); }
});
new ResizeObserver(size).observe(stage);
new MutationObserver(function () { colors(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { colors(); draw(); });
colors(); size(); pickStory(DATA[0].id);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
